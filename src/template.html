<title>Pujiverse How to Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a rulebook. Sticky scoreboard bar on top, then an index of categories; each category opens a numbered list of entries that unfold into set-up / play / win steps. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#111922; --muted:#5B6674; --line:#D8DEE5; --hi:#FFC93C; --hi-ink:#111922; --focus:#1F5BD8; --bar:#111922; --bar-fg:#F3F5F7; --on-ch:#FFFFFF;
  --ch-sports:#178A4E; --ch-gaming:#6E44D4; --ch-guess:#9A5B00; --ch-quiz:#1F5BD8; --ch-mind:#C93A54;
  --st-indoor:#2F9E57; --st-outdoor:#E2B100; --st-water:#2C7BE5; --st-ice:#9AA6B2; --st-digital:#7B4DDB; --st-air:#EE7A1A; --st-any:#FFFFFF;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1319; --surface:#151D26; --ink:#E7ECF1; --muted:#95A2B0; --line:#26313D; --hi:#FFC93C; --hi-ink:#111922; --focus:#7FA8FF; --bar:#070B10; --bar-fg:#E7ECF1; --on-ch:#0D1319;
  --ch-sports:#3CC983; --ch-gaming:#A889FF; --ch-guess:#F2A93B; --ch-quiz:#6E9BFF; --ch-mind:#FF7A90;
  --st-any:#2A3541; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#151D26; --ink:#E7ECF1; --muted:#95A2B0; --line:#26313D; --hi:#FFC93C; --hi-ink:#111922; --focus:#7FA8FF; --bar:#070B10; --bar-fg:#E7ECF1; --on-ch:#0D1319;
  --ch-sports:#3CC983; --ch-gaming:#A889FF; --ch-guess:#F2A93B; --ch-quiz:#6E9BFF; --ch-mind:#FF7A90;
  --st-any:#2A3541; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg)}
.bar{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:19px;letter-spacing:.04em}
.brand span{font-family:var(--f-mono);font-size:11px;opacity:.7}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:13.5px;font-weight:500;text-decoration:none;padding:6px 10px;border-radius:6px;opacity:.82}
.nav a:hover{opacity:1;background:color-mix(in srgb,var(--bar-fg) 12%,transparent)}
.nav a.on{opacity:1;background:var(--hi);color:var(--hi-ink)}
.nav a.home{opacity:1;border:1px solid color-mix(in srgb,var(--bar-fg) 35%,transparent)}
.qwrap{margin-left:auto;flex:1 1 220px;max-width:340px;position:relative}
.qwrap input{width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid transparent;background:color-mix(in srgb,var(--bar-fg) 14%,transparent);color:var(--bar-fg)}
.qwrap input::placeholder{color:color-mix(in srgb,var(--bar-fg) 60%,transparent)}
.qwrap input:focus{outline:none;border-color:var(--hi)}
.qwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}

/* type */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-stretch:68%;font-weight:850;font-size:clamp(46px,9vw,104px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
h2{font-stretch:75%;font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1;text-transform:uppercase}
h3{font-stretch:100%;font-weight:700;font-size:17px;line-height:1.2}
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
mark{background:var(--hi);color:var(--hi-ink);padding:0 .15em;border-radius:2px}

/* hero */
.hero{padding-block:40px 28px;display:grid;gap:18px}
.hero h1 span{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:0 .08em;margin-left:-.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend b{font-weight:500;color:var(--ink)}

/* chips */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted)}
.st i{width:10px;height:10px;border-radius:2px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);flex:none}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--c)}
.ch::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.c-sports{--c:var(--ch-sports)}.c-gaming{--c:var(--ch-gaming)}.c-guess{--c:var(--ch-guess)}.c-quiz{--c:var(--ch-quiz)}.c-mind{--c:var(--ch-mind)}

/* channel strip */
.chstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.chstrip a{background:var(--surface);padding:12px 14px;text-decoration:none;display:grid;gap:2px;border-top:3px solid var(--c)}
.chstrip a:hover{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.chstrip strong{font-family:var(--f-display);font-stretch:85%;font-size:16px;font-weight:800}
.chstrip small{color:var(--muted);font-size:12px}

/* groups + category cards */
.group{padding-block:30px 6px;display:grid;gap:14px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 12px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-1px)}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.card .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* category page */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-top:22px}
.crumbs a{color:var(--muted)}
.chead{display:grid;gap:12px;padding-block:10px 18px}
.chead .row1{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.yt{background:var(--c);border-color:var(--c);color:var(--on-ch)}
.btn.yt:hover{filter:brightness(1.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:3;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.tools input{font:inherit;font-size:14px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1 1 180px;max-width:280px}
.fchip{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip i{width:9px;height:9px;border-radius:2px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hi);padding:8px 12px;border-radius:6px;max-width:70ch}
.part{display:flex;align-items:baseline;gap:12px;padding:22px 0 8px}
.part h3{font-stretch:80%;text-transform:uppercase;font-size:15px;letter-spacing:.03em}
.part .eyebrow{font-size:11px}

/* entry rows */
.list{display:grid;gap:6px}
details.e{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.e[open]{border-color:var(--ink)}
details.e summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:3.2ch minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px}
details.e summary::-webkit-details-marker{display:none}
details.e summary:hover .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.num{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nmw{min-width:0;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.nm{font-weight:600;font-size:15.5px}
.meta{font-size:13px;color:var(--muted)}
.caret{width:14px;height:14px;transition:transform .15s;color:var(--muted)}
details.e[open] .caret{transform:rotate(90deg)}
.right{display:flex;gap:12px;align-items:center}

/* how to play block */
.play{border-top:1px solid var(--line);padding:16px 16px 14px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
.goal{font-size:15px;margin:0 0 12px}
.goal b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;font-weight:500;margin-bottom:2px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:var(--hi-ink)}
ol.steps li span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ol.steps li p{margin:0}
dl.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14px;align-content:start}
dl.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dl.facts dd{margin:0}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.copied{font-size:12.5px;color:var(--muted);align-self:center}

/* entry page */
.epage{padding-block:8px 30px;display:grid;gap:16px}
.epage .panel{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r)}
.epage .panel .play{border-top:0}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* channels page */
.chgrid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-block:8px 30px}
.chcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.chcard h3{font-stretch:85%;font-size:22px;font-weight:850;text-transform:uppercase}
.chcard ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.chcard li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.chcard li a{text-decoration:none}
.chcard li a:hover{text-decoration:underline}

.empty{padding:30px 0;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:22px 34px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer p{margin:0;max-width:70ch}

@media (max-width:760px){
  .chstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chstrip a:last-child{grid-column:1/-1}
  .play{grid-template-columns:1fr;gap:16px}
  .top{position:relative;top:auto}
  .bar{gap:10px}
  .nav{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .nav a{white-space:nowrap}
  .qwrap{order:3;max-width:none;flex-basis:100%}
  .tools{top:env(safe-area-inset-top,0px)}
  details.e summary{grid-template-columns:3ch minmax(0,1fr) auto}
  .right .st span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="https://www.pujiverse.com/" target="_blank" rel="noopener" title="Go to pujiverse.com"><b>PUJIVERSE</b><span>HOW TO PLAY</span></a>
    <nav class="nav" aria-label="Main">
      <a class="home" href="https://www.pujiverse.com/" target="_blank" rel="noopener">Home · pujiverse.com</a>
      <a href="#" data-v="index">All</a>
      <a href="#sports" data-v="sports">Sports</a>
      <a href="#games" data-v="games">Games</a>
      <a href="#channels" data-v="channels">Channels</a>
    </nav>
    <label class="qwrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search 1,716 games and sports" autocomplete="off" aria-label="Search games and sports"></label>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer><div class="wrap">
  <p>Pujiverse Games &amp; Sports. Origin shows where a game or sport is believed to come from or is best known; many have disputed or shared origins. Rules shown are the common basics; local and official rules vary.</p>
  <p><a href="https://www.pujiverse.com/" target="_blank" rel="noopener">pujiverse.com</a></p>
</div></footer>

<script>
const D = /*__DATA__*/null;
const CH = {
  sports:{name:'Pujiverse Sports', handle:'@pujiversesports', blurb:'Every sport, from the Olympics to village fields'},
  gaming:{name:'Pujiverse Gaming', handle:'@pujiversegaming', blurb:'Party, kids, traditional and video games'},
  guess:{name:'Pujiverse Guess', handle:'@pujiverseguess', blurb:'Guess from clips, sounds, pictures and clues'},
  quiz:{name:'Pujiverse Quiz', handle:'@pujiversequiz', blurb:'Trivia formats and classroom quiz games'},
  mind:{name:'Pujiverse Mind', handle:'@pujiversemind', blurb:'Board, card, dice, puzzle and brain games'}
};
const CH_ORDER = ['sports','gaming','guess','quiz','mind'];
const SET = [['Indoor','indoor'],['Outdoor','outdoor'],['Water','water'],['Ice/Snow','ice'],['Digital','digital'],['Air','air'],['Any','any']];
const STEP_LABELS = ['Set up','Play','Win'];
const PART = 20;

// index
D.cats.forEach((c,i)=>{c.i=i;c.items=[];});
D.items.forEach((it,i)=>D.cats[it[1]].items.push(i));
const byUid = {};
D.items.forEach((it,i)=>{(byUid[it[7]] ||= []).push(i);});
const bySlug = {}; D.cats.forEach(c=>bySlug[c.s]=c);
const groups = []; D.cats.forEach(c=>{let g=groups.find(x=>x.n===c.g); if(!g){g={n:c.g,cats:[]};groups.push(g);} g.cats.push(c);});
const chCount = {}; D.cats.forEach(c=>chCount[c.ch]=(chCount[c.ch]||0)+c.items.length);

const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => n.toLocaleString('en-US');
const ytChannel = ch => 'https://www.youtube.com/' + CH[ch].handle;
const ytSearch = (ch,name) => ytChannel(ch) + '/search?query=' + encodeURIComponent(name);
const setChip = (k,label=true) => `<span class="st"><i style="background:var(--st-${SET[k][1]})"></i><span>${SET[k][0]}</span></span>`;
const chChip = ch => `<a class="ch c-${ch}" href="${ytChannel(ch)}" target="_blank" rel="noopener">${CH[ch].name}</a>`;
const caret = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const app = document.getElementById('app');
const q = document.getElementById('q');

function playBlock(i){
  const it = D.items[i], c = D.cats[it[1]], st = D.steps[it[7]];
  const steps = st.map((s,k)=>`<li><div><span>${STEP_LABELS[k]}</span><p>${esc(s)}</p></div></li>`).join('');
  return `<div class="play">
    <div>
      <p class="goal"><b>In one line</b>${esc(it[6])}</p>
      <ol class="steps">${steps}</ol>
    </div>
    <dl class="facts">
      <dt>Players</dt><dd>${esc(it[3]||'—')}</dd>
      <dt>You need</dt><dd>${esc(it[4]||'—')}</dd>
      <dt>Where</dt><dd>${setChip(it[5])}</dd>
      <dt>Origin</dt><dd>${esc(it[2]||'—')}</dd>
      <dt>Category</dt><dd><a href="#c-${c.s}">${esc(c.n)}</a></dd>
      <dt>Channel</dt><dd>${chChip(c.ch)}</dd>
    </dl>
    <div class="acts">
      <a class="btn yt c-${c.ch}" href="${ytSearch(c.ch,it[0])}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Watch on ${CH[c.ch].name}</a>
      <a class="btn" href="#p-${i}">Open page</a>
      <button class="btn" type="button" data-copy="${i}">Copy link</button>
      <span class="copied" aria-live="polite"></span>
    </div>
  </div>`;
}

function row(i, n, hl){
  const it = D.items[i], c = D.cats[it[1]];
  let name = esc(it[0]);
  if (hl) { const re = new RegExp('('+hl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); name = name.replace(re,'<mark>$1</mark>'); }
  const meta = [it[2], it[3]].filter(Boolean).map(esc).join(' · ');
  const extra = hl ? ` · ${esc(c.n)}` : '';
  return `<details class="e" data-i="${i}"><summary>
    <span class="num">${String(n).padStart(2,'0')}</span>
    <span class="nmw"><span class="nm">${name}</span><span class="meta">${meta}${extra}</span></span>
    <span class="right">${setChip(it[5])}${caret}</span>
  </summary></details>`;
}

// lazy-fill the how-to-play block when a row opens
app.addEventListener('toggle', e=>{
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.open || d.dataset.f) return;
  d.dataset.f = 1; d.insertAdjacentHTML('beforeend', playBlock(+d.dataset.i));
}, true);
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const url = location.href.split('#')[0] + '#p-' + b.dataset.copy;
  const out = b.parentElement.querySelector('.copied');
  const done = t => { out.textContent = t; setTimeout(()=>out.textContent='', 2500); };
  try { navigator.clipboard.writeText(url).then(()=>done('Link copied'), ()=>done(url)); } catch(_) { done(url); }
});

function setNav(v){ document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on', a.dataset.v===v)); }

function viewIndex(filter){
  const gs = groups.filter(g => filter==='sports' ? g.n==='Sports' : filter==='games' ? g.n!=='Sports' : true);
  const total = gs.reduce((s,g)=>s+g.cats.reduce((t,c)=>t+c.items.length,0),0);
  const ncat = gs.reduce((s,g)=>s+g.cats.length,0);
  const title = filter==='sports' ? 'How to play <span>sports</span>' : filter==='games' ? 'How to play <span>games</span>' : 'How to <span>play</span>';
  const lede = filter==='sports' ? `${fmt(total)} sports in ${ncat} categories, from the Olympics to village fields. Open any one to see how it is set up, played and won.`
    : filter==='games' ? `${fmt(total)} games in ${ncat} categories: guessing, tabletop, mind, party, kids, traditional and digital. Open any one to learn it in three steps.`
    : `${fmt(total)} games and sports in ${ncat} categories, each explained in three steps: set up, play, win. Pick a category or search by name.`;
  let h = `<section class="hero"><div class="eyebrow">Pujiverse Games &amp; Sports</div><h1>${title}</h1><p class="lede">${lede}</p>
    <div class="legend"><b>Where it is played</b>${SET.map((s,k)=>setChip(k)).join('')}</div></section>`;
  if (!filter){
    h += `<div class="chstrip">${CH_ORDER.map(ch=>`<a class="c-${ch}" href="#channels"><strong>${CH[ch].name}</strong><small>${fmt(chCount[ch]||0)} videos planned</small></a>`).join('')}</div>`;
  }
  for (const g of gs){
    const n = g.cats.reduce((t,c)=>t+c.items.length,0);
    h += `<section class="group"><div class="ghead"><h2>${esc(g.n)}</h2><span class="eyebrow">${g.cats.length} categories · ${fmt(n)} entries</span></div><div class="grid">`;
    for (const c of g.cats) h += `<a class="card" href="#c-${c.s}"><h3>${esc(c.n)}</h3><p>${esc(c.d)}</p><div class="foot"><span class="n">${c.items.length} entries</span><span class="ch c-${c.ch}">${CH[c.ch].name}</span></div></a>`;
    h += `</div></section>`;
  }
  app.innerHTML = h;
}

const catState = {set:-1, f:''};
function viewCat(c){
  const g = c.g;
  const sets = [...new Set(c.items.map(i=>D.items[i][5]))].sort((a,b)=>a-b);
  const parts = Math.ceil(c.items.length/PART);
  let h = `<nav class="crumbs" aria-label="Breadcrumb"><a href="#">All categories</a><span>/</span><a href="#${g==='Sports'?'sports':'games'}">${esc(g)}</a></nav>
  <section class="chead"><h2>${esc(c.n)}</h2><p class="lede">${esc(c.d)}. ${c.items.length} entries, shown as ${parts} video part${parts>1?'s':''} of up to ${PART}.</p>
    <div class="row1"><a class="btn yt c-${c.ch}" href="${ytChannel(c.ch)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>${CH[c.ch].name} on YouTube</a><span class="meta mono">${CH[c.ch].handle}</span></div>
    ${c.n==='Casino & Gambling'?'<p class="note">Games of chance are for adults only, and only where they are legal. Rules are explained for understanding, not to encourage betting.</p>':''}
  </section>
  <div class="tools"><input id="cf" type="search" placeholder="Filter this category" aria-label="Filter this category" value="${esc(catState.f)}">
    <button class="fchip" data-set="-1" aria-pressed="${catState.set<0}">All settings</button>
    ${sets.map(k=>`<button class="fchip" data-set="${k}" aria-pressed="${catState.set===k}"><i style="background:var(--st-${SET[k][1]})"></i>${SET[k][0]}</button>`).join('')}
  </div><div id="clist"></div>`;
  app.innerHTML = h;
  const draw = () => {
    const f = catState.f.trim().toLowerCase();
    let out = '', shown = 0;
    for (let p=0; p<parts; p++){
      const slice = c.items.slice(p*PART, p*PART+PART);
      const rows = slice.map((i,k)=>({i, n:p*PART+k+1})).filter(({i})=>{
        const it = D.items[i];
        return (catState.set<0 || it[5]===catState.set) && (!f || (it[0]+' '+it[2]).toLowerCase().includes(f));
      });
      if (!rows.length) continue;
      shown += rows.length;
      out += `<div class="part"><h3>Part ${p+1}</h3><span class="eyebrow">entries ${p*PART+1}–${p*PART+slice.length}</span></div><div class="list">${rows.map(r=>row(r.i,r.n)).join('')}</div>`;
    }
    document.getElementById('clist').innerHTML = shown ? out : `<p class="empty">Nothing in this category matches. Clear the filter to see all ${c.items.length}.</p>`;
  };
  draw();
  document.getElementById('cf').addEventListener('input', e=>{catState.f=e.target.value; draw();});
  app.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click', ()=>{
    catState.set = +b.dataset.set;
    app.querySelectorAll('.fchip').forEach(x=>x.setAttribute('aria-pressed', String(+x.dataset.set===catState.set)));
    draw();
  }));
}

function viewEntry(i){
  const it = D.items[i], c = D.cats[it[1]];
  const pos = c.items.indexOf(i);
  const prev = c.items[pos-1], next = c.items[pos+1];
  const also = (byUid[it[7]]||[]).filter(j=>j!==i).map(j=>`<a href="#c-${D.cats[D.items[j][1]].s}">${esc(D.cats[D.items[j][1]].n)}</a>`);
  app.innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="#">All categories</a><span>/</span><a href="#c-${c.s}">${esc(c.n)}</a><span>/</span><span>Part ${Math.floor(pos/PART)+1} · #${pos+1}</span></nav>
  <section class="epage"><div class="eyebrow">How to play</div><h2>${esc(it[0])}</h2>
    ${also.length?`<p class="meta">Also listed in ${also.join(', ')}</p>`:''}
    <div class="panel">${playBlock(i)}</div>
    <div class="pn">${prev!=null?`<a class="btn" href="#p-${prev}">← ${esc(D.items[prev][0])}</a>`:'<span></span>'}${next!=null?`<a class="btn" href="#p-${next}">${esc(D.items[next][0])} →</a>`:''}</div>
  </section>`;
}

function viewChannels(){
  let h = `<section class="hero"><div class="eyebrow">Where the videos go</div><h1>The <span>channels</span></h1><p class="lede">Every category is assigned to one of five Pujiverse YouTube channels. Each entry's "Watch" button searches that channel for the game by name.</p></section><div class="chgrid">`;
  for (const ch of CH_ORDER){
    const cs = D.cats.filter(c=>c.ch===ch);
    h += `<div class="chcard c-${ch}"><div class="eyebrow">${CH[ch].handle}</div><h3>${CH[ch].name}</h3><p class="meta" style="margin:0">${CH[ch].blurb}. ${cs.length} categor${cs.length>1?'ies':'y'} · ${fmt(chCount[ch]||0)} entries.</p>
      <ul>${cs.map(c=>`<li><a href="#c-${c.s}">${esc(c.n)}</a><span class="mono meta">${c.items.length}</span></li>`).join('')}</ul>
      <a class="btn yt c-${ch}" href="${ytChannel(ch)}" target="_blank" rel="noopener">Open ${CH[ch].name}</a></div>`;
  }
  app.innerHTML = h + '</div>';
}

function viewSearch(term){
  const t = term.trim().toLowerCase();
  const seen = new Set(), hits = [];
  D.items.forEach((it,i)=>{ if (seen.has(it[7])) return; const n = it[0].toLowerCase();
    if (n.includes(t) || it[2].toLowerCase().includes(t) || D.cats[it[1]].n.toLowerCase().includes(t)) { seen.add(it[7]); hits.push([n.startsWith(t)?0:n.includes(t)?1:2, i]); } });
  hits.sort((a,b)=>a[0]-b[0]);
  const shown = hits.slice(0,80);
  app.innerHTML = `<section class="chead" style="padding-top:26px"><div class="eyebrow">Search</div><h2>“${esc(term.trim())}”</h2>
    <p class="lede">${hits.length ? `${fmt(hits.length)} match${hits.length>1?'es':''}${hits.length>80?', showing the first 80':''}. Open one to see how to play.` : 'No games or sports match. Try a shorter word, a country, or a category name.'}</p></section>
    <div class="list">${shown.map(([,i],k)=>row(i,k+1,term.trim())).join('')}</div>`;
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h !== 'search' && q.value && document.activeElement!==q) q.value='';
  if (h.startsWith('c-') && bySlug[h.slice(2)]){ const c = bySlug[h.slice(2)]; if (route.last!==h){catState.set=-1;catState.f='';} setNav(c.g==='Sports'?'sports':'games'); viewCat(c); }
  else if (/^p-\d+$/.test(h) && D.items[+h.slice(2)]) { setNav(''); viewEntry(+h.slice(2)); }
  else if (h==='channels'){ setNav('channels'); viewChannels(); }
  else if (h==='sports' || h==='games'){ setNav(h); viewIndex(h); }
  else if (h==='search' && q.value.trim()){ setNav(''); viewSearch(q.value); }
  else { setNav('index'); viewIndex(); }
  if (route.last!==h) window.scrollTo(0,0);
  route.last = h;
}
let qt;
q.addEventListener('input', ()=>{ clearTimeout(qt); qt = setTimeout(()=>{
  if (q.value.trim()){ if (location.hash!=='#search') location.hash='search'; else viewSearch(q.value); }
  else if (location.hash==='#search') location.hash='';
}, 140); });
window.addEventListener('hashchange', route);
route();
</script>
