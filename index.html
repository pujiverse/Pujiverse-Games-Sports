<style>
/* Layout: a rulebook. Sticky scoreboard bar on top, then an index of categories; each category opens a numbered list of entries that unfold into set-up / play / win steps. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#111922; --muted:#5B6674; --line:#D8DEE5; --hi:#FFC93C; --hi-ink:#111922; --focus:#1F5BD8; --bar:#111922; --bar-fg:#F3F5F7; --on-ch:#FFFFFF;
  --ch-sports:#178A4E; --ch-gaming:#6E44D4; --ch-guess:#9A5B00; --ch-quiz:#1F5BD8; --ch-mind:#C93A54;
  --st-indoor:#2F9E57; --st-outdoor:#E2B100; --st-water:#2C7BE5; --st-ice:#9AA6B2; --st-digital:#7B4DDB; --st-air:#EE7A1A; --st-any:#FFFFFF;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1319; --surface:#151D26; --ink:#E7ECF1; --muted:#95A2B0; --line:#26313D; --hi:#FFC93C; --hi-ink:#111922; --focus:#7FA8FF; --bar:#070B10; --bar-fg:#E7ECF1; --on-ch:#0D1319;
  --ch-sports:#3CC983; --ch-gaming:#A889FF; --ch-guess:#F2A93B; --ch-quiz:#6E9BFF; --ch-mind:#FF7A90;
  --st-any:#2A3541; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#151D26; --ink:#E7ECF1; --muted:#95A2B0; --line:#26313D; --hi:#FFC93C; --hi-ink:#111922; --focus:#7FA8FF; --bar:#070B10; --bar-fg:#E7ECF1; --on-ch:#0D1319;
  --ch-sports:#3CC983; --ch-gaming:#A889FF; --ch-guess:#F2A93B; --ch-quiz:#6E9BFF; --ch-mind:#FF7A90;
  --st-any:#2A3541; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg)}
.bar{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:19px;letter-spacing:.04em}
.brand span{font-family:var(--f-mono);font-size:11px;opacity:.7}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:13.5px;font-weight:500;text-decoration:none;padding:6px 10px;border-radius:6px;opacity:.82}
.nav a:hover{opacity:1;background:color-mix(in srgb,var(--bar-fg) 12%,transparent)}
.nav a.on{opacity:1;background:var(--hi);color:var(--hi-ink)}
.nav a.home{opacity:1;border:1px solid color-mix(in srgb,var(--bar-fg) 35%,transparent)}
.qwrap{margin-left:auto;flex:1 1 220px;max-width:340px;position:relative}
.qwrap input{width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid transparent;background:color-mix(in srgb,var(--bar-fg) 14%,transparent);color:var(--bar-fg)}
.qwrap input::placeholder{color:color-mix(in srgb,var(--bar-fg) 60%,transparent)}
.qwrap input:focus{outline:none;border-color:var(--hi)}
.qwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}

/* type */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-stretch:68%;font-weight:850;font-size:clamp(46px,9vw,104px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
h2{font-stretch:75%;font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1;text-transform:uppercase}
h3{font-stretch:100%;font-weight:700;font-size:17px;line-height:1.2}
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
mark{background:var(--hi);color:var(--hi-ink);padding:0 .15em;border-radius:2px}

/* hero */
.hero{padding-block:40px 28px;display:grid;gap:18px}
.hero h1 span{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:0 .08em;margin-left:-.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend b{font-weight:500;color:var(--ink)}

/* chips */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted)}
.st i{width:10px;height:10px;border-radius:2px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);flex:none}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--c)}
.ch::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.c-sports{--c:var(--ch-sports)}.c-gaming{--c:var(--ch-gaming)}.c-guess{--c:var(--ch-guess)}.c-quiz{--c:var(--ch-quiz)}.c-mind{--c:var(--ch-mind)}

/* channel strip */
.chstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.chstrip a{background:var(--surface);padding:12px 14px;text-decoration:none;display:grid;gap:2px;border-top:3px solid var(--c)}
.chstrip a:hover{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.chstrip strong{font-family:var(--f-display);font-stretch:85%;font-size:16px;font-weight:800}
.chstrip small{color:var(--muted);font-size:12px}

/* groups + category cards */
.group{padding-block:30px 6px;display:grid;gap:14px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 12px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-1px)}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.card .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* category page */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-top:22px}
.crumbs a{color:var(--muted)}
.chead{display:grid;gap:12px;padding-block:10px 18px}
.chead .row1{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.yt{background:var(--c);border-color:var(--c);color:var(--on-ch)}
.btn.yt:hover{filter:brightness(1.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:3;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.tools input{font:inherit;font-size:14px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1 1 180px;max-width:280px}
.fchip{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip i{width:9px;height:9px;border-radius:2px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hi);padding:8px 12px;border-radius:6px;max-width:70ch}
.part{display:flex;align-items:baseline;gap:12px;padding:22px 0 8px}
.part h3{font-stretch:80%;text-transform:uppercase;font-size:15px;letter-spacing:.03em}
.part .eyebrow{font-size:11px}

/* entry rows */
.list{display:grid;gap:6px}
details.e{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.e[open]{border-color:var(--ink)}
details.e summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:3.2ch minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px}
details.e summary::-webkit-details-marker{display:none}
details.e summary:hover .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.num{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nmw{min-width:0;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.nm{font-weight:600;font-size:15.5px}
.meta{font-size:13px;color:var(--muted)}
.caret{width:14px;height:14px;transition:transform .15s;color:var(--muted)}
details.e[open] .caret{transform:rotate(90deg)}
.right{display:flex;gap:12px;align-items:center}

/* how to play block */
.play{border-top:1px solid var(--line);padding:16px 16px 14px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
.goal{font-size:15px;margin:0 0 12px}
.goal b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;font-weight:500;margin-bottom:2px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:var(--hi-ink)}
ol.steps li span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ol.steps li p{margin:0}
dl.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14px;align-content:start}
dl.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dl.facts dd{margin:0}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.copied{font-size:12.5px;color:var(--muted);align-self:center}

/* entry page */
.epage{padding-block:8px 30px;display:grid;gap:16px}
.epage .panel{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r)}
.epage .panel .play{border-top:0}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* channels page */
.chgrid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-block:8px 30px}
.chcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.chcard h3{font-stretch:85%;font-size:22px;font-weight:850;text-transform:uppercase}
.chcard ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.chcard li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.chcard li a{text-decoration:none}
.chcard li a:hover{text-decoration:underline}

.empty{padding:30px 0;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:22px 34px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer p{margin:0;max-width:70ch}

@media (max-width:760px){
  .chstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chstrip a:last-child{grid-column:1/-1}
  .play{grid-template-columns:1fr;gap:16px}
  .top{position:relative;top:auto}
  .bar{gap:10px}
  .nav{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .nav a{white-space:nowrap}
  .qwrap{order:3;max-width:none;flex-basis:100%}
  .tools{top:env(safe-area-inset-top,0px)}
  details.e summary{grid-template-columns:3ch minmax(0,1fr) auto}
  .right .st span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

"Stand on the shooting line facing a 122 cm target 70 m away with a recurve bow.","Shoot arrows in timed ends; rings score 10 at the centre down to 1 at the edge.","Win sets by higher end totals; first to 6 set points wins the match."],["Choose a track, jump, throw, road or combined event.","Run, jump or throw within the rules of that event, staying in lanes and behind lines.","Fastest time, longest distance or greatest height wins."],["Play on a netted court with rackets and a shuttlecock, one or two per side.","Serve diagonally underarm and rally; the shuttle must land in bounds and cross the net.","Score a point on every rally; first to 21 (by 2) wins a game, best of three games."],["Two teams of five play full court; 3x3 uses one hoop on a half court.","Dribble, pass and shoot; field goals score 2 or 3 points (1 or 2 in 3x3), free throws 1.","Most points when time ends wins; in 3x3, first to 21 also wins."],["Two boxers of the same weight class meet in a ring wearing gloves.","Land clean punches above the belt over three rounds; no holding, kicking or low blows.","Win by knockout, referee stoppage or judges' decision."],["Two B-Boys or B-Girls face off in a battle with a DJ playing.","Take turns dancing rounds of toprock, footwork, freezes and power moves to the music.","Judges vote for the stronger dancer on technique, creativity and musicality."],["Paddle a canoe or kayak alone or in crews on flat water or a whitewater course.","Sprint races go straight down lanes; slalom racers pass through hanging gates in order.","Fastest time wins; in slalom, touching or missing gates adds penalty seconds."],["Choose road, track, mountain bike or BMX.","Race other riders over a course or track, using drafting, sprints and tactics.","First across the line or fastest time wins."],["Rider and horse compete in dressage, eventing or show jumping.","Dressage shows precise movements; jumping clears fences; eventing combines both plus cross-country.","Best judged score or fewest penalties wins."],["Two fencers face off on a strip with foil, épée or sabre.","Lunge and parry to touch valid target areas; electronic scoring registers hits.","First to 15 touches (or the most when time runs out) wins."],["Two teams of eleven play on a grass pitch with goals at each end.","Move the ball with feet, head and body; only the goalkeeper may use hands in the box.","The team with more goals after 90 minutes wins."],["Play 18 holes on a course with a set of clubs and a ball.","Hit from the tee toward the green and putt into the hole, counting every stroke.","Lowest total strokes over the rounds wins."],["Choose artistic, rhythmic or trampoline gymnastics.","Perform a routine on an apparatus or floor, showing difficulty and clean execution.","Judges add difficulty and execution scores; highest score wins."],["Two teams of seven play indoors with goals and a 6 m goal area.","Pass and bounce the ball, take no more than three steps holding it, and shoot.","Most goals after two 30-minute halves wins."],["Two teams of eleven play on a pitch with hooked sticks and a small hard ball.","Use only the flat side of the stick; goals must be shot from inside the circle.","Most goals after four quarters wins."],["Two judoka in gi meet on a mat within their weight class.","Grip and throw, pin, choke or armlock your opponent using judo techniques.","An ippon ends the bout; otherwise the most waza-ari scores wins."],["Compete in fencing, 200 m swimming, obstacle course and a laser-run.","Points from each event are added up; the laser-run start is staggered by points.","First athlete across the laser-run finish line wins."],["Rowers sit in boats of 1 to 8, with one or two oars each.","Race in lanes over 2,000 m, rowing in rhythm with the crew.","First boat across the finish line wins."],["Two teams of seven play on a full-size rugby pitch.","Pass backwards, run forward and tackle; play is fast over two 7-minute halves.","Tries score 5, conversions 2; most points wins."],["Sail a dinghy, kiteboard or windsurf board on a marked course.","Use the wind to round marks in order, following right-of-way rules.","Lowest total points across races (1st = 1 point) wins."],["Shooters fire rifles, pistols or shotguns at fixed or flying targets.","Each shot is scored by how close it hits the centre or whether it breaks the clay.","Highest total score after the final wins."],["Skaters ride a street course or a park bowl with a skateboard.","Perform runs of tricks like ollies, grinds and flips within a time limit.","Judges score difficulty and style; best score wins."],["Climbers compete in speed, bouldering and lead climbing.","Speed is a race up a fixed wall; boulder and lead test problems and height reached.","Fastest time or most problems topped and highest hold reached wins."],["Surfers paddle out into ocean waves in heats of 2 to 4.","Ride waves and perform turns, airs and barrels within the heat time.","Best two wave scores are added; highest total wins."],["Play on a table with a net, paddles and a light ball.","Serve so the ball bounces once on each side; rally until someone misses.","First to 11 points (by 2) wins a game; best of 5 or 7 games."],["Two fighters wear electronic body protectors and headgear.","Score with kicks and punches to the body and head; kicks to the head score most.","Win the most rounds by points, or by knockout."],["Play on a court with a net, rackets and a ball, singles or doubles.","Serve diagonally, rally after one bounce, and keep the ball inside the lines.","Win points, games and sets; best of 3 or 5 sets wins."],["Athletes swim, cycle and run in one continuous race.","Transition quickly between disciplines in the transition zone.","First across the finish line wins."],["Indoor volleyball uses 6 per side on a court; beach volleyball uses 2 per side on sand.","Hit the ball over the net in up to three touches without catching it.","Rally scoring to 25 (21 on beach); win the most sets."],["Lifters compete in their bodyweight class with a barbell.","Get three attempts each at the snatch and the clean and jerk.","The best lift of each added together gives the total; highest total wins."],["Two wrestlers of the same weight meet on a circular mat.","Score by takedowns and exposing the opponent's back; Greco-Roman bans holds below the waist.","Win by pin (fall), technical superiority or most points."],["Two teams of eleven play on an oval field with a bat, ball and wickets.","Each team bats for 20 overs while the other bowls and fields.","The team scoring more runs wins."],["Two teams of five play on a small field with flags on each player's belt.","Advance the ball by passing and running; pull a flag instead of tackling.","Touchdowns score 6; most points wins."],["Two teams of six play on a small field with stick nets.","Pass, catch and shoot the ball into the goal; play is fast with a shot clock.","Most goals wins."],["Two players hit a small rubber ball in a four-walled court.","Hit the ball to the front wall above the tin before it bounces twice.","First to 11 (by 2) wins a game; best of five games."],["Two teams of nine take turns batting and fielding on a diamond.","Batters hit pitched balls and run the bases; fielders get three outs to end the half-inning.","Most runs after nine innings (seven in softball) wins."],["Ski down a marked course through gates on a snowy mountain.","Events range from fast downhill to technical slalom with tight turns.","Fastest time wins; missing a gate disqualifies."],["Cross-country ski with a rifle on your back.","Stop at the range to shoot five targets prone or standing.","Fastest time wins; misses add penalty loops or time."],["Teams of two or four push a sled and jump in on an ice track.","The pilot steers through the curves while the brakeman stops at the end.","Lowest combined time over all runs wins."],["Ski long distances over snowy terrain using classic or skating technique.","Race individually, in mass starts or relays.","Fastest time or first across the line wins."],["Two teams slide granite stones toward a target (the house) on ice.","Sweepers brush the ice to guide each stone; teams alternate throws.","Score a point for each stone closer to the centre than the opponent's best; most points wins."],["Skate solo, in pairs or ice dance to music.","Perform jumps, spins, lifts and step sequences in short and free programmes.","Judges score technical elements and presentation; highest total wins."],["Ski in moguls, aerials, halfpipe, slopestyle or ski cross.","Perform jumps and tricks or race head-to-head, depending on the event.","Judges' scores or first across the line wins."],["Two teams of six skate on an ice rink with sticks and a puck.","Pass and shoot the puck into the goal; body checking is allowed in men's play.","Most goals after three periods wins."],["Lie on your back, feet first, on a small sled on an ice track.","Steer with your calves and shoulders through the curves.","Lowest combined time over all runs wins."],["Combine ski jumping and cross-country skiing.","The jump result sets your start gap for the cross-country race.","First across the cross-country finish line wins."],["Four to six skaters race on a 111 m oval track.","Race in packs, overtaking around tight corners without impeding others.","First across the line advances; win the final."],["Lie head-first on a small sled on an ice track.","Sprint to start, dive onto the sled and steer with your body.","Lowest combined time over all runs wins."],["Ski down a jump ramp and fly as far as possible.","Land in telemark position with good style.","Distance points plus style points; highest score wins."],["Climb uphill on skis with skins and descend off-piste.","Switch between climbing, boot-carrying sections and downhill skiing.","Fastest time wins."],["Ride a snowboard in halfpipe, slopestyle, big air, cross or parallel events.","Perform tricks for judges or race against other riders.","Highest judged score or first across the line wins."],["Two skaters race on a 400 m oval in separate lanes.","Skate set distances, switching lanes on each lap.","Fastest time wins."],["Athletes with impairments compete in classes in track and field events.","Run, jump or throw using guides, prosthetics or racing chairs where needed.","Fastest time or longest distance in each class wins."],["Swimmers compete in classes based on their impairment.","Race in standard strokes; visually impaired swimmers have tappers at the walls.","Fastest time in each class wins."],["Players in wheelchairs throw or roll leather balls toward a white jack ball.","Each side throws six balls; ramps and assistants are allowed in some classes.","Score a point for each ball closer to the jack than the opponent's closest."],["Two teams of three blindfolded players defend a goal across the full court width.","Roll a ball with bells inside toward the opposing goal; defenders listen and block.","Most goals wins; spectators must stay silent."],["Two teams of five play basketball in sports wheelchairs.","Push twice, then dribble or pass; standard hoop and court sizes are used.","Most points wins."],["Two teams of four play in reinforced wheelchairs on a basketball court.","Carry the ball across the try line; chair-to-chair contact is allowed.","Most goals wins."],["Play tennis from a wheelchair, singles or doubles.","The ball may bounce twice, with the first bounce inside the court.","Standard tennis scoring decides the winner."],["Two fencers sit in wheelchairs fixed to the floor.","Fence with foil, épée or sabre at a fixed distance.","First to 15 touches wins."],["Two teams of five play; outfield players are blindfolded and goalkeepers are sighted.","The ball has a rattle inside; players call \"voy\" to signal their position.","Most goals wins."],["Two teams of six play volleyball sitting on the floor with a low net.","Players must keep their buttocks on the floor when touching the ball.","Rally scoring to 25; win the most sets."],["Two teams of six sit on sledges with two short sticks.","Use the spiked end to push and the blade end to pass and shoot the puck.","Most goals after three periods wins."],["Teams of four in wheelchairs deliver stones by hand or with a delivery stick.","There is no sweeping; teams alternate throws toward the house.","Most stones nearest the centre over the ends wins."],["Athletes ski downhill or cross-country in standing, sitting or visually impaired classes.","Sit-skiers use mono-skis; visually impaired skiers follow a guide.","Factored times decide the winner in each class."],["Two teams of eleven on a pitch, each with a goalkeeper.","Kick, pass and head the ball; hands only for the keeper in the box; offside rules apply.","Most goals after 90 minutes wins."],["Two teams of five play on a hard indoor court with a smaller, low-bounce ball.","Pass quickly with unlimited substitutions; kick-ins replace throw-ins.","Most goals after two 20-minute halves wins."],["Two teams of five play barefoot on sand.","Use flicks, bicycle kicks and volleys since the ball rarely rolls.","Most goals after three 12-minute periods wins."],["Mark small goals with bags or stones on any street or yard.","Play small-sided games with local rules, often without referees.","First to an agreed score or most goals wins."],["Two teams of five play on a court with a hoop at each end.","Dribble, pass and shoot; no walking with the ball; shot clock applies.","Baskets score 2 or 3, free throws 1; most points wins."],["Two teams of three play on a half court with one hoop.","After a defensive rebound, take the ball outside the arc before shooting.","Inside-arc baskets score 1, outside 2; first to 21 or most points after 10 minutes wins."],["Two teams of six play on a court divided by a high net.","Use up to three touches to hit the ball over; rotate positions after winning serve.","Rally scoring to 25 by 2; best of five sets wins."],["Two players per side play on sand with a net.","Use up to three touches; players switch sides every 7 points.","Rally scoring to 21; best of three sets wins."],["Two teams of four play on sand with goals.","Pass and shoot; spin shots and in-flight shots score double.","Win each half; a shoot-out decides tied matches."],["Two teams of seven play on a court with a ring at each end.","Players hold set positions, cannot run with the ball and must pass within 3 seconds.","Goals from inside the circle score; most goals wins."],["Mixed teams of eight (four men, four women) play with tall baskets without backboards.","Pass the ball; no dribbling or running with it; men mark men and women mark women.","Most baskets wins."],["Two teams of seven play in a deep pool.","Swim with the ball and pass with one hand; only goalkeepers may use two hands.","Most goals after four quarters wins."],["Two teams of fifteen play on a grass pitch with H-shaped posts.","Run with the ball and pass backwards; tackles lead to rucks, mauls and scrums.","Tries 5, conversions 2, penalties and drop goals 3; most points wins."],["Two teams of thirteen play on a rugby pitch.","Each team gets six tackles to advance before handing over possession.","Tries 4, goals 2, drop goals 1; most points wins."],["Two teams of six play on a pitch without tackling.","Touching the ball carrier counts as a tackle; after six touches possession changes.","Most touchdowns wins."],["Two teams of eleven play on a field with end zones.","The offence gets four downs to gain 10 yards by running or passing.","Touchdown 6, field goal 3, extra points 1 or 2; most points wins."],["Two teams of twelve play on a larger field with deep end zones.","The offence gets three downs to gain 10 yards.","Touchdowns, field goals and the single (rouge) score; most points wins."],["Two teams of eighteen play on an oval with four posts at each end.","Kick, handball and run, bouncing the ball every 15 m.","A kick between the middle posts scores 6; outer posts 1; most points wins."],["Two teams of fifteen play on a pitch with H-shaped goals.","Carry the ball four steps, then bounce or solo it; kick or hand-pass to teammates.","A goal under the bar scores 3, over the bar 1; most points wins."],["Two teams of nine play on a court with a net.","Catch the ball and throw it over the net within 3 seconds.","A point is won when the ball lands in the opponent's court; win the most sets."],["Two teams of three play on a badminton-sized court with a rattan ball.","Use feet, knees, chest and head, never hands, with up to three touches.","Rally scoring to 21; best of three sets wins."],["Two players per side play on sand with a volleyball net.","Use any body part except hands and arms, up to three touches.","Rally scoring to 18 or 21; win the most sets."],["Players stand on either side of a curved table.","Use up to three touches with any body part except hands; the ball must bounce once on each side.","First to 12 wins a set; best of three sets wins."],["Two teams play on a baseball diamond with a rubber ball.","The pitcher rolls the ball; the kicker kicks it and runs the bases.","Most runs after the innings wins."],["Two teams stand on each side of a centre line with several soft balls.","Throw balls to hit opponents; catching a ball gets the thrower out.","The team that eliminates all opponents wins."],["Two teams of seven play on a field with end zones and a flying disc.","Pass the disc; the holder cannot run; a dropped pass changes possession.","Catch the disc in the end zone to score; first to 15 wins."],["Two teams of five play with baskets on poles and no backboards.","Pass the ball by hand only; there is no dribbling.","Most baskets wins."],["Two teams of four ride horses with a ball that has handles.","Pick up the ball from horseback and pass among riders.","Throw the ball through the opponent's ring; most goals wins."],["Two teams play on an inflatable court with a trampoline on each side.","Use hands, feet and head to send the ball over the net; spikes from the trampoline score more.","First to 25 wins a set."],["Two teams of seven play with a rebound frame at each end.","Throw the ball at a frame so it bounces out of reach; interception is not allowed.","A point is scored if the rebound lands untouched in the court."],["Two teams of six play in a deep pool with a saltwater-filled ball.","Pass the ball underwater and dive with it toward the basket on the pool floor.","Most goals in the opponent's basket wins."],["Two players per side ride fixed-gear bikes on a small court.","Move the ball using only the bike wheels; hands and feet are not allowed.","Most goals wins."],["Two teams of five play on a court with a net and a yellow woollen ball.","Hit the ball over the net with rackets; it must not touch the floor.","Points to 29; best of three games wins."],["Two teams of eleven play a match with two innings each over up to five days.","Bowlers try to take 10 wickets; batters score runs between wickets or by boundaries.","Win by scoring more runs and dismissing the other side twice; otherwise a draw."],["Each team bats for one innings of 50 overs.","Fielding restrictions apply in powerplays; each bowler may bowl 10 overs.","The team with more runs wins."],["Each team bats for one innings of 20 overs.","Each bowler bowls up to 4 overs; a six-over powerplay starts each innings.","The team with more runs wins; a Super Over breaks ties."],["Each team faces 100 balls.","Bowlers deliver sets of 5 or 10 balls from one end.","The team with more runs wins."],["Each team bats for 10 overs.","Matches last about 90 minutes with aggressive batting.","The team with more runs wins."],["Two teams of 6 to 8 play in a netted box or cage.","Short overs and special rules award runs for hitting nets and walls.","Most runs wins."],["Play in a lane or yard with any bat, ball and stumps you have.","Agree on local rules, such as one-tip-one-hand and no running for hits over walls.","Most runs wins."],["Wrap a tennis ball in electrical tape for extra pace and swing.","Play short-over matches with street rules.","Most runs wins."],["Two teams of eight play in a fully netted indoor court.","Batters run in pairs; hitting the nets scores runs and getting out deducts runs.","Highest total wins."],["Set up stumps on firm sand near the water.","Play casual overs with everyone batting and bowling.","Most runs wins."],["Large village teams play with a three-sided bat and a rubber ball.","Everyone may bat; the game mixes singing and dancing.","Most runs wins; hosting a feast follows."],["Two teams of nine take turns batting and fielding on a diamond.","The pitcher throws to the batter; three strikes is out and four balls is a walk.","Score a run by touching all four bases; most runs after nine innings wins."],["Two teams of nine play on a smaller diamond with a larger ball.","The pitcher throws underarm; batters hit and run the bases.","Most runs after seven innings wins."],["Two teams of ten play recreational softball.","Pitches arrive in a high slow arc; there is no stealing bases.","Most runs wins."],["Two teams of nine play with a short bat and four posts.","Batters hit the ball and run around the posts.","A full circuit scores a rounder; most rounders wins."],["Two teams of nine play on a zigzag field.","The pitcher tosses the ball vertically above home plate; batters run a zigzag route.","Most runs after two periods wins."],["Two teams play with a bat on a field between two lines.","Batters hit the ball and run to the far line and back while fielders try to hit them with the ball.","Most successful runs wins."],["Two teams of eleven play with a wooden bat and a board on a stake as the wicket.","Bowlers throw underarm at the board; batters protect it and run.","Most runs wins."],["Two teams of twelve women play with a tennis-racket-shaped bat.","Batters must run on every hit; bowlers bowl from one end continuously.","Most runs wins."],["Play in a city street with a broomstick and a rubber ball.","Pitch or fungo-hit the ball; parked cars and manholes serve as bases.","Most runs wins."],["Use a light plastic bat and a perforated plastic ball.","Pitch and hit; the ball curves wildly and fielding is simple.","Most runs wins."],["Young players hit the ball off a tee instead of a pitch.","Batters run the bases after hitting; everyone bats each inning.","Usually no score is kept; practice and fun come first."],["Use a long stick (danda) and a short tapered stick (gilli).","Strike the end of the gilli to flip it up, then hit it far.","Points are counted by measuring distance in danda lengths."],["Lay a small spindle-shaped cat on the ground and use a stick to strike it.","Hit the cat into the air, then strike it again as far as possible.","Distance in stick lengths gives points; most points wins."],["Two teams of eleven play with a bat and a ball on a rectangular field.","Batters hit and run the field while fielders try to hit them with the ball.","Points for runs and hits; most points wins."],["Two teams play with a bat and a tennis ball.","Batters hit and run around bases; fielders return the ball to the burn spot.","Points for runs and catches; most points wins."],["Two teams of eleven play with sticks and a hard ball.","Use the flat side of the stick only; shoot from inside the circle.","Most goals after four quarters wins."],["Two teams of six play on an indoor court with side boards.","Push the ball (no hitting); the boards keep play moving.","Most goals wins."],["Two teams of five play on roller skates with sticks and a ball.","Pass and shoot the ball into the goal, with boards around the rink.","Most goals wins."],["Two teams of four play on inline skates with a puck.","Pass and shoot; there is no offside or icing in most rules.","Most goals wins."],["Two teams of six play indoors with light sticks and a plastic ball with holes.","Lifting the stick high and body checking are not allowed.","Most goals after three periods wins."],["Two teams of eleven play on a large ice rink with curved sticks and a ball.","Skate and pass like football on ice; the ball cannot be played above the shoulder.","Most goals wins."],["Two teams of six play on ice with straight sticks and a rubber ring.","Pass the ring across each blue line; no body contact.","Most goals wins."],["Two teams of fifteen play with a hurley and a small ball (sliotar).","Carry the ball on the hurley, strike it far or catch it in the hand.","A goal scores 3, over the bar scores 1; most points wins."],["Two teams of fifteen women play hurling-style with a camán.","Strike, carry and catch the sliotar; rules are close to hurling.","A goal scores 3, over the bar 1; most points wins."],["Two teams of twelve play with curved sticks (camans) and a small ball.","The ball can be played in the air and with both sides of the stick.","Most goals wins."],["Two teams of ten play with netted sticks on a large field.","Cradle, pass and shoot the ball; body checks are allowed in men's play.","Most goals wins."],["Two teams of six play indoors in a hockey rink.","Play fast with a shot clock and physical contact.","Most goals wins."],["Two teams of six play on a small field for short periods.","A 30-second shot clock keeps play fast; no faceoffs after goals.","Most goals wins."],["Two teams of four ride horses and hit a ball with long mallets.","Play several chukkas, changing horses between them; right-of-way rules protect riders.","Most goals wins."],["Two teams of three ride bikes with mallets and a ball.","Hit the ball with the end of the mallet; putting a foot down means tapping out.","Most goals wins."],["Two teams of four ride elephants steered by mahouts.","Players hit a polo ball with long mallets.","Most goals wins."],["Two teams of five in kayaks play on water with goals above the surface.","Pass the ball by hand or paddle; push opponents' kayaks to tackle.","Most goals wins."],["Two teams of six wear masks, fins and snorkels in a pool.","Push a lead puck along the pool floor with short sticks while holding your breath.","Most goals in the opponent's tray wins."],["Two teams of six wear rubber shoes on ice and use brooms.","Hit a small ball into the goal without skates.","Most goals wins."],["Two teams play with curved sticks and a small ball on a long field.","Drive the ball past the opponent's end line.","Most goals wins."],["Play on a frozen pond with skates, sticks and a puck.","Pick sides; no goalies, no checks and no lifting the puck.","First to an agreed score wins."],["Two teams of six sit on sledges with two short sticks.","Push with the spiked ends and shoot with the blades.","Most goals wins."],["Two village teams play with curved sticks and a ball.","Drive the ball across the field; numbers per team are flexible.","Most goals wins."],["Players use a curved stick and a ball in an open village ground.","Hit the ball toward the opponent's goal line or target.","Most goals wins."],["Play on an enclosed indoor court with sloping roofs (penthouses).","Hit the ball off the walls and roofs with a lopsided racket.","Win points by chases and openings; first to six games wins a set."],["Two to four players use short rackets and a hollow ball in a closed court.","The ball may hit any wall or the ceiling but must reach the front wall before the floor.","First to 15 wins a game; best of three games."],["Play on a small court with paddles and a plastic ball with holes.","Serve underarm diagonally; the ball must bounce once on each side before volleys are allowed.","First to 11 (by 2) wins; only the serving side scores."],["Two pairs play on an enclosed court with glass walls.","Serve underarm; the ball may rebound off walls after bouncing.","Scored like tennis; best of three sets wins."],["Two pairs play on a raised court surrounded by wire fences.","Serve once; the ball may be played off the fences after bouncing.","Scored like tennis."],["Play on a small court with solid paddles and a depressurized ball.","Serve underarm and rally like tennis.","Scored like tennis."],["Two pairs play on sand with paddles and a net.","Hit the ball before it touches the sand.","Scored like tennis, often with no-ad points."],["Two to four players hit a ball against a front wall with tennis rackets.","The ball must hit the wall above a line and bounce once on the floor.","First to an agreed score wins."],["Play against a front wall (fronton) with hands, rackets or baskets.","Return the ball to the wall before it bounces twice.","First to an agreed score wins."],["Two to four players use a curved wicker basket (cesta) to catch and throw a hard ball.","Catch the ball and throw it in one motion against the front wall.","First to 7 or 9 points wins."],["Two players use rackets and a heavier shuttle with no net.","Hit the shuttle into the opponent's square court, set about 12 m apart.","First to 16 points wins a set."],["Play on a tennis court with a soft rubber ball.","Rally like tennis; doubles is the most common format.","Games to 4 points; first to win the set wins."],["Two to four players play in a large four-walled court with a hard ball.","Hit the ball to the front wall above a board; it moves very fast.","First to 15 wins a game."],["Two teams of five play with a tambourine-like racket.","Hit the ball across the field to the other side.","Scored like tennis; most games wins."],["Use a weighted feather shuttle and stand in a circle or across a net.","Kick the shuttle to keep it in the air.","Count keeps or play over a net; first to 21 wins."],["Two pairs stand around a small round trampoline net.","Hit the ball onto the net in up to three touches; teams move freely around it.","Rally scoring to 21 wins."],["Two players stand on each side of a pole with a tethered ball.","Hit the ball in your direction to wind the rope around the pole.","First to wind the ball fully around wins."],["Sprinters start from blocks in lanes.","Run 100 m straight at full speed; one false start disqualifies.","Fastest time wins."],["Run one half-lap (200 m) or one full lap (400 m) in lanes.","Use staggered starts and hold your speed around the bend.","Fastest time wins."],["Run 800 m or 1500 m with lane breaks after the start.","Pace yourself and save energy for a final kick.","First across the line wins."],["Run 12.5 or 25 laps of the track.","Keep a steady pace and manage your position in the pack.","First across the line wins."],["Run 42.195 km on roads.","Pace yourself and drink at water stations.","First across the finish line wins; others race to beat their own time."],["Run 21.1 km on roads.","Hold a steady pace and fuel along the way.","First across the line wins."],["Run distances beyond 42.195 km, often 50 km to 100 miles.","Manage food, water and pacing over trails or roads.","First finisher or longest distance in the time limit wins."],["Sprint over 10 hurdles: 110 m for men, 100 m for women.","Keep a set number of strides between hurdles; knocking them over is allowed.","Fastest time wins."],["Run one lap over 10 hurdles in lanes.","Keep rhythm between hurdles and finish strong.","Fastest time wins."],["Run 3000 m over barriers and a water jump.","Clear 28 barriers and 7 water jumps.","First across the line wins."],["Four runners form a team, each running one leg.","Pass the baton within the changeover zone.","First team across the line wins; dropping the baton costs time."],["Walk fast with one foot always on the ground and the front leg straight.","Judges show cards for faults; three red cards disqualify.","First across the line wins."],["Sprint down the runway and jump from the take-off board.","Land in the sandpit; overstepping the board is a foul.","Longest jump wins."],["Sprint and take off from the board.","Hop, step and then jump into the sandpit.","Longest total distance wins."],["Run up and jump over a horizontal bar.","Most athletes use the Fosbury Flop; three misses at a height eliminate you.","Highest clearance wins."],["Sprint with a flexible pole and plant it in the box.","Swing up and over the bar without knocking it off.","Highest clearance wins."],["Stand in a circle holding a heavy metal ball at your neck.","Push the shot with one hand from the shoulder without leaving the circle.","Longest throw wins."],["Stand in a circle holding a heavy disc.","Spin and release the discus within the sector lines.","Longest throw wins."],["Run down the runway holding a javelin.","Throw it overarm; the metal tip must land first.","Longest throw wins."],["Stand in a caged circle holding a ball on a wire with a handle.","Spin three or four times and release.","Longest throw wins."],["Compete in ten events over two days.","100 m, long jump, shot, high jump, 400 m, hurdles, discus, pole vault, javelin and 1500 m.","Points from each event are added; highest total wins."],["Compete in seven events over two days.","100 m hurdles, high jump, shot, 200 m, long jump, javelin and 800 m.","Highest total points wins."],["Run across fields, mud and hills, usually 4 to 12 km.","Individuals score by finishing position; teams add their top runners.","First runner and lowest team score win."],["Run on mountain paths and forest trails.","Navigate climbs, descents and rough ground.","Fastest time wins."],["Race up and down hills, often off-path.","Choose your own route between checkpoints in some races.","Fastest time wins."],["Run on mountains above 2,000 m with steep climbs.","Manage altitude, steep ground and weather.","Fastest time wins."],["Run a course with walls, ropes, mud and carries.","Complete every obstacle or take a penalty.","Fastest time wins."],["Show up at a park for a free timed 5 km run each Saturday.","Run, jog or walk; volunteers time you with your barcode.","Everyone gets a result; aim to beat your own time."],["Two fighters wear gloves and shin guards in a ring.","Punch and kick over timed rounds; rules vary on knees and elbows.","Win by knockout, stoppage or judges' points."],["Two fighters wear gloves in a ring after the Wai Kru ritual dance.","Strike with fists, elbows, knees and shins and clinch over five rounds.","Win by knockout or judges' decision."],["Two fighters wrap their hands in tape with no gloves.","Punch, kick, knee, elbow and headbutt over five rounds.","Traditionally only a knockout wins; otherwise it is a draw."],["Two fighters with gloves meet in a ring.","Use punches, kicks, knees and elbows like Muay Thai, with Khmer music playing.","Win by knockout or judges' points."],["Two fighters wear gloves and special boots.","Kick with the foot only (no shins or knees) and punch.","Win by points or knockout."],["Two fighters meet on a raised platform (lei tai).","Punch, kick and throw; pushing the opponent off the platform scores.","Win by points over rounds or by knockout."],["Two wrestlers meet on a circular mat.","Attack the whole body, including legs, to take down and turn the opponent.","Win by pin, 10-point lead or most points."],["Two wrestlers meet on a circular mat.","Use only holds above the waist; no leg attacks or trips.","Win by pin, 8-point lead or most points."],["Two wrestlers in mawashi belts face off in a circular ring (dohyo).","Charge at the start and push, slap or throw the opponent.","The first to leave the ring or touch the ground with anything but the feet loses."],["Two wrestlers in loincloths compete in a soft earth pit (akhada).","Grip, throw and pin using traditional holds.","Pinning both shoulders to the earth wins."],["A gymnast performs on a vertical wooden pole or hanging rope.","Climb, twist, balance and hold poses on the pole.","Judges score difficulty and execution."],["Practise in a kalari pit with a guru.","Learn body conditioning, kicks, then sticks, swords and shields.","Progress through levels; demonstrations are judged on skill."],["Use a long bamboo staff.","Spin and strike in patterns, working on footwork and speed.","In matches, touches score points; in forms, judges score skill."],["Practise with sticks and shields or traditional weapons.","Spar using strikes and blocks with circular footwork.","Touches score points in competition."],["Learn sword (thang) and spear (ta) techniques.","Practise forms and sparring with stick-swords and shields.","Judges score technique and touches."],["Train with weapons like sword, spear and lathi.","Perform drills and weapon demonstrations.","Judges score skill and control."],["Two karateka in gi meet on a mat, or one performs kata.","In kumite, score with controlled punches and kicks; in kata, perform set forms.","Most points in kumite or highest judged kata score wins."],["Two fighters wear armour and use bamboo swords (shinai).","Strike the head, wrists, body or throat with correct spirit and shout.","The first to two valid points wins."],["Partners train on a mat, one attacking and one defending.","Redirect the attacker's energy into throws and joint locks.","There is no winner; progress is graded by belt tests."],["Two players in gi meet on a mat.","Use throws, joint locks and strikes from traditional forms.","Win by technique scores or submission."],["Two grapplers in gi meet on a mat.","Take down, pass guard and control positions; aim for chokes or joint locks.","Win by submission or points."],["Practise on a mat with a partner.","Use kicks, strikes, joint locks and throws for self-defence.","Progress is graded by belts; sparring is scored in some events."],["Two wrestlers tie a satba belt around the waist and thigh.","Start kneeling with grips on each other's belts, then stand and throw.","The first to touch the ground with anything above the knee loses."],["Choose forms (taolu) or sparring (sanda).","Perform set routines or spar with kicks, punches and throws.","Judges score forms; sparring is won on points."],["Stand relaxed with feet shoulder-width apart.","Move slowly through a sequence of flowing postures with deep breathing.","There is no winner; competitions judge form and balance."],["Train with a partner at close range.","Use straight-line punches, chain punches and sticky-hands drills.","Progress is graded by skill."],["Two wrestlers wear jackets and belts.","Grip the jacket and throw the opponent to the ground.","Throws and takedowns score; most points wins."],["Two fighters in black uniforms meet on a mat.","Strike, kick, sweep and take down using silat techniques.","Judges score techniques; most points wins."],["Two fighters use rattan sticks, often with padding.","Strike to target areas using angles and flowing patterns.","Clean hits score points."],["Train with strikes, grappling and weapon drills.","Use elbows, knees, headbutts and locks in sequences.","Graded by krama colour; competitions are judged."],["Practise on a mat.","Use kicks, punches, scissor takedowns and leg throws.","Sparring is scored on points."],["Two wrestlers wear vests and boots outdoors.","Grip and throw; there are no rounds or weight classes.","The first to touch the ground with anything but the feet loses."],["Two wrestlers wear jackets and belts.","Throw the opponent using only standing techniques; ground fighting is not allowed.","A clean throw onto the back wins outright."],["Train in a domed pit (gowd) led by a drummer.","Swing heavy clubs, spin and do push-ups to rhythm.","There is no winner; it builds strength and spirit."],["Two wrestlers in leather trousers cover themselves in olive oil.","Grip the trousers (kispet) to control and lift the opponent.","Pinning the opponent's back or lifting him wins."],["Two fighters wear jackets and shorts.","Throw and use leg locks and arm locks; combat sambo adds strikes.","Win by total victory (clean throw or submission) or points."],["Train with partners on breathing, movement and relaxation.","Defend against strikes and grabs with flowing movement.","There is no competition; skill grows with practice."],["Train with a partner and pads.","Learn to neutralise threats with strikes, blocks and escapes.","Progress by level; there are no sport matches."],["Players form a circle (roda) with music from the berimbau.","Two players move in the ginga ns."],["Two cars line up on a straight strip.","Launch when the lights go green and race a quarter mile.","First across the line wins."],["Drivers slide cars sideways through corners.","Follow lines and angles set by judges.","Judges score line, angle and style."],["Drivers race small karts on short tracks.","Race heats and finals.","First across the line wins."],["One driver at a time races up a hill road.","Drive the course as fast as possible.","Fastest time wins."],["Drive a giant truck in an arena.","Race or perform jumps, wheelies and crushes.","Judges score freestyle; fastest wins racing."],["Drivers enter an arena in old cars.","Ram other cars to disable them.","The last car still moving wins."],["Riders race prototype motorbikes on circuits.","Qualify, then race around 20 laps.","First across the line wins; points decide the title."],["Riders race modified production bikes.","Race laps on road circuits.","First across wins."],["Riders race on dirt tracks with jumps.","Race two motos over rough terrain.","Best combined results win."],["Riders race dirt tracks built inside stadiums.","Race tight laps with big jumps.","First across wins."],["Riders race long off-road courses.","Pass checkpoints within set times.","Lowest total time wins."],["Four riders race on an oval dirt track.","Bikes have no brakes; slide through turns over four laps.","First across scores the most points."],["Riders race on public roads closed for the event.","Each rider starts alone at intervals around the 60 km course.","Fastest time wins."],["Riders jump bikes off ramps.","Perform tricks in the air.","Judges score the best run."],["Riders cross sections of rocks and logs.","Keep feet off the ground.","Fewest penalty points win."],["A driver and a passenger ride a three-wheeled machine.","The passenger shifts weight to help in corners.","First across wins."],["Drivers race heavy truck tractors on circuits.","Race laps with speed limits.","First across wins."],["Pilots fly planes around function playBlock(i){
  const it = D.items[i], c = D.cats[it[1]], st = D.steps[it[7]];
  const steps = st.map((s,k)=>`<li><div><span>${STEP_LABELS[k]}</span><p>${esc(s)}</p></div></li>`).join('');
  return `<div class="play">
    <div>
      <p class="goal"><b>In one line</b>${esc(it[6])}</p>
      <ol class="steps">${steps}</ol>
    </div>
    <dl class="facts">
      <dt>Players</dt><dd>${esc(it[3]||'—')}</dd>
      <dt>You need</dt><dd>${esc(it[4]||'—')}</dd>
      <dt>Where</dt><dd>${setChip(it[5])}</dd>
      <dt>Origin</dt><dd>${esc(it[2]||'—')}</dd>
      <dt>Category</dt><dd><a href="#c-${c.s}">${esc(c.n)}</a></dd>
      <dt>Channel</dt><dd>${chChip(c.ch)}</dd>
    </dl>
    <div class="acts">
      <a class="btn yt c-${c.ch}" href="${ytSearch(c.ch,it[0])}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Watch on ${CH[c.ch].name}</a>
      <a class="btn" href="#p-${i}">Open page</a>
      <button class="btn" type="button" data-copy="${i}">Copy link</button>
      <span class="copied" aria-live="polite"></span>
    </div>
  </div>`;
}

function row(i, n, hl){
  const it = D.items[i], c = D.cats[it[1]];
  let name = esc(it[0]);
  if (hl) { const re = new RegExp('('+hl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); name = name.replace(re,'<mark>$1</mark>'); }
  const meta = [it[2], it[3]].filter(Boolean).map(esc).join(' · ');
  const extra = hl ? ` · ${esc(c.n)}` : '';
  return `<details class="e" data-i="${i}"><summary>
    <span class="num">${String(n).padStart(2,'0')}</span>
    <span class="nmw"><span class="nm">${name}</span><span class="meta">${meta}${extra}</span></span>
    <span class="right">${setChip(it[5])}${caret}</span>
  </summary></details>`;
}

// lazy-fill the how-to-play block when a row opens
app.addEventListener('toggle', e=>{
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.open || d.dataset.f) return;
  d.dataset.f = 1; d.insertAdjacentHTML('beforeend', playBlock(+d.dataset.i));
}, true);
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const url = location.href.split('#')[0] + '#p-' + b.dataset.copy;
  const out = b.parentElement.querySelector('.copied');
  const done = t => { out.textContent = t; setTimeout(()=>out.textContent='', 2500); };
  try { navigator.clipboard.writeText(url).then(()=>done('Link copied'), ()=>done(url)); } catch(_) { done(url); }
});

function viewIndex(filter){
  const gs = groups.filter(g => filter==='sports' ? g.n==='Sports' : filter==='games' ? g.n!=='Sports' : true);
  const total = gs.reduce((s,g)=>s+g.cats.reduce((t,c)=>t+c.items.length,0),0);
  const ncat = gs.reduce((s,g)=>s+g.cats.length,0);
  const title = filter==='sports' ? 'How to play <span>sports</span>' : filter==='games' ? 'How to play <span>games</span>' : 'How to <span>play</span>';
  const lede = filter==='sports' ? `${fmt(total)} sports in ${ncat} categories, from the Olympics to village fields. Open any one to see how it is set up, played and won.`
    : filter==='games' ? `${fmt(total)} games in ${ncat} categories: guessing, tabletop, mind, party, kids, traditional and digital. Open any one to learn it in three steps.`
    : `${fmt(total)} games and sports in ${ncat} categories, each explained in three steps: set up, play, win. Pick a category or search by name.`;
  let h = `<section class="hero"><div class="eyebrow">Pujiverse Games &amp; Sports</div><h1>${title}</h1><p class="lede">${lede}</p>
    <div class="legend"><b>Where it is played</b>${SET.map((s,k)=>setChip(k)).join('')}</div></section>`;
  if (!filter){
    h += `<div class="chstrip">${CH_ORDER.map(ch=>`<a class="c-${ch}" href="#channels"><strong>${CH[ch].name}</strong><small>${fmt(chCount[ch]||0)} videos planned</small></a>`).join('')}</div>`;
  }
  for (const g of gs){
    const n = g.cats.reduce((t,c)=>t+c.items.length,0);
    h += `<section class="group"><div class="ghead"><h2>${esc(g.n)}</h2><span class="eyebrow">${g.cats.length} categories · ${fmt(n)} entries</span></div><div class="grid">`;
    for (const c of g.cats) h += `<a class="card" href="#c-${c.s}"><h3>${esc(c.n)}</h3><p>${esc(c.d)}</p><div class="foot"><span class="n">${c.items.length} entries</span><span class="ch c-${c.ch}">${CH[c.ch].name}</span></div></a>`;
    h += `</div></section>`;
  }
  app.innerHTML = h;
}

      const rows = slice.map((i,k)=>({i, n:p*PART+k+1})).filter(({i})=>{
        const it = D.items[i];
        return (catState.set<0 || it[5]===catState.set) && (!f || (it[0]+' '+it[2]).toLowerCase().includes(f));
      });
      if (!rows.length) continue;
      shown += rows.length;
      out += `<div class="part"><h3>Part ${p+1}</h3><span class="eyebrow">entries ${p*PART+1}–${p*PART+slice.length}</span></div><div class="list">${rows.map(r=>row(r.i,r.n)).join('')}</div>`;
    }
    document.getElementById('clist').innerHTML = shown ? out : `<p class="empty">Nothing in this category matches. Clear the filter to see all ${c.items.length}.</p>`;
  };
  draw();
  document.getElementById('cf').addEventListener('input', e=>{catState.f=e.target.value; draw();});
  app.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click', ()=>{
    catState.set = +b.dataset.set;
    app.querySelectorAll('.fchip').forEach(x=>x.setAttribute('aria-pressed', String(+x.dataset.set===catState.set)));
    draw();
  }));
}

function viewEntry(i){
  const it = D.items[i], c = D.cats[it[1]];
  const pos = c.items.indexOf(i);
  const prev = c.items[pos-1], next = c.items[pos+1];
  const also = (byUid[it[7]]||[]).filter(j=>j!==i).map(j=>`<a href="#c-${D.cats[D.items[j][1]].s}">${esc(D.cats[D.items[j][1]].n)}</a>`);
  app.innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="#">All categories</a><span>/</span><a href="#c-${c.s}">${esc(c.n)}</a><span>/</span><span>Part ${Math.floor(pos/PART)+1} · #${pos+1}</span></nav>
  <section class="epage"><div class="eyebrow">How to play</div><h2>${esc(it[0])}</h2>
    ${also.length?`<p class="meta">Also listed in ${also.join(', ')}</p>`:''}
    <div class="panel">${playBlock(i)}</div>
    <div class="pn">${prev!=null?`<a class="btn" href="#p-${prev}">← ${esc(D.items[prev][0])}</a>`:'<span></span>'}${next!=null?`<a class="btn" href="#p-${next}">${esc(D.items[next][0])} →</a>`:''}</div>
  </section>`;
}

function viewChannels(){
  let h = `<section class="hero"><div class="eyebrow">Where the videos go</div><h1>The <span>channels</span></h1><p class="lede">Every category is assigned to one of five Pujiverse YouTube channels. Each entry's "Watch" button searches that channel for the game by name.</p></section><div class="chgrid">`;
  for (const ch of CH_ORDER){
    const cs = D.cats.filter(c=>c.ch===ch);
    h += `<div class="chcard c-${ch}"><div class="eyebrow">${CH[ch].handle}</div><h3>${CH[ch].name}</h3><p class="meta" style="margin:0">${CH[ch].blurb}. ${cs.length} categor${cs.length>1?'ies':'y'} · ${fmt(chCount[ch]||0)} entries.</p>
      <ul>${cs.map(c=>`<li><a href="#c-${c.s}">${esc(c.n)}</a><span class="mono meta">${c.items.length}</span></li>`).join('')}</ul>
      <a class="btn yt c-${ch}" href="${ytChannel(ch)}" target="_blank" rel="noopener">Open ${CH[ch].name}</a></div>`;
  }
  app.innerHTML = h + '</div>';
}

function viewSearch(term){
  const t = term.trim().toLowerCase();
  const seen = new Set(), hits = [];
  D.items.forEach((it,i)=>{ if (seen.has(it[7])) return; const n = it[0].toLowerCase();
    if (n.includes(t) || it[2].toLowerCase().includes(t) || D.cats[it[1]].n.toLowerCase().includes(t)) { seen.add(it[7]); hits.push([n.startsWith(t)?0:n.includes(t)?1:2, i]); } });
  hits.sort((a,b)=>a[0]-b[0]);
  const shown = hits.slice(0,80);
  app.innerHTML = `<section class="chead" style="padding-top:26px"><div class="eyebrow">Search</div><h2>“${esc(term.trim())}”</h2>
    <p class="lede">${hits.length ? `${fmt(hits.length)} match${hits.length>1?'es':''}${hits.length>80?', showing the first 80':''}. Open one to see how to play.` : 'No games or sports match. Try a shorter word, a country, or a category name.'}</p></section>
    <div class="list">${shown.map(([,i],k)=>row(i,k+1,term.trim())).join('')}</div>`;
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h !== 'search' && q.value && document.activeElement!==q) q.value='';
  if (h.startsWith('c-') && bySlug[h.slice(2)]){ const c = bySlug[h.slice(2)]; if (route.last!==h){catState.set=-1;catState.f='';} setNav(c.g==='Sports'?'sports':'games'); viewCat(c); }
  else if (/^p-\d+$/.test(h) && D.items[+h.slice(2)]) { setNav(''); viewEntry(+h.slice(2)); }
  else if (h==='channels'){ setNav('channels'); viewChannels(); }
  else if (h==='sports' || h==='games'){ setNav(h); viewIndex(h); }
  else if (h==='search' && q.value.trim()){ setNav(''); viewSearch(q.value); }
  else { setNav('index'); viewIndex(); }
  if (route.last!==h) window.scrollTo(0,0);
  route.last = h;
}
let qt;
q.addEventListener('input', ()=>{ clearTimeout(qt); qt = setTimeout(()=>{
  if (q.value.trim()){ if (location.hash!=='#search') location.hash='search'; else viewSearch(q.value); }
  else if (location.hash==='#search') location.hash='';
}, 140); });
window.addEventListener('hashchange', route);
route();
</script>
